[project]
name = "bankparse-api"
version = "0.1.0"
description = "Local web API to import bank statements with bankparse and store operations in SQLite."
requires-python = ">=3.11"
dependencies = [
    "bankparse",
    "fastapi[standard]>=0.162.4",
    "openpyxl>=3.1.5",
    "sqlmodel>=0.0.49",
]

[project.scripts]
bankparse-app = "bankparse_api.cli:main"

[tool.uv.sources]
bankparse = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bankparse_api"]
