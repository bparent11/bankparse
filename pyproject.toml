[project]
name = "bankparse-workspace"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = ["bankparse", "bankparse-api"]

[tool.uv]
package = false

[tool.uv.sources]
bankparse = { workspace = true }
bankparse-api = { workspace = true }

[tool.uv.workspace]
members = ["packages/bankparse", "apps/api"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8", "httpx>=0.28"]

[tool.pytest.ini_options]
testpaths = ["packages/bankparse/tests", "apps/api/tests"]

[tool.ruff]
line-length = 110
